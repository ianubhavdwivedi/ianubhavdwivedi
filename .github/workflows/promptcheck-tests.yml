name: PromptCheck tests

on:
  push:
    paths:
      - "projects/promptcheck/**"
      - ".github/workflows/promptcheck-tests.yml"
  pull_request:
    paths:
      - "projects/promptcheck/**"
      - ".github/workflows/promptcheck-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s projects/promptcheck -p 'test_*.py' -v
